# SPA server config — served behind caddy (TLS terminates there).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip text payloads (JS/CSS/SVG dominate the bundle).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml
               application/vnd.ms-fontobject application/x-font-ttf font/ttf;

    # Immutable hashed assets — Vite emits content-hashed filenames, so they
    # can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API calls are routed to the .NET service by the caddy proxy upstream —
    # nginx never sees them; this block just fails fast if misrouted.
    location /api/ {
        return 502;
    }

    # Never cache index.html: a stale entry would reference pruned hashed
    # chunks and break deployments mid-flight for open tabs.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Favicon etc. at the root + SPA fallback (client-side router owns paths).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
