# ═══════════════════════════════════════════════════════════════════════════
# OBSERVABILITY / GUI OVERRIDE — local development ONLY
#
# Usage:   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
# Stop:    same command with `down` (add --volumes only if you want to wipe
#          Langfuse data too — NOT the sql_data volume).
#
# Adds four visual tools on top of the base stack; touches nothing else:
#
#   SSMS / Azure Data Studio  → db port published to 127.0.0.1:1433
#                               (connect with sa + SA_PASSWORD from .env)
#   Dozzle                    → http://localhost:9999   live container logs
#   Filebrowser               → http://localhost:9998   browse image storage
#                               (admin/admin on first login — CHANGE IT)
#   Langfuse                  → http://localhost:3000   LLM call traces
#                               (create admin account on first visit;
#                                then set LANGFUSE_PUBLIC_KEY/SECRET_KEY in
#                                .env and restart grading to capture calls)
#
# Everything here is loopback-only — no ports are exposed to your network.
# This file is git-ignored; keep it out of production hosts.
#
# NOTE for Langfuse ⇄ grading wiring: the grading service must be able to
# REACH Langfuse. Containers reach it at http://langfuse:3000, but if you
# route Anthropic through the 9router gateway (docker-compose.override.yml),
# set OTEL endpoint to http://host.docker.internal:3000 instead.
# ═══════════════════════════════════════════════════════════════════════════

services:
  db:
    # Loopback-only SQL port so Windows-side SSMS / Azure Data Studio can
    # connect: Server: localhost,1433 · Login: sa · Password: $SA_PASSWORD
    ports: !override
      - "127.0.0.1:1433:1433"

  dozzle:
    # Live stdout/stderr of every container, searchable, followable.
    # Shows .NET api console output AND the Python grading JSON records
    # (provider/model/tokens/cost per call).
    image: amir20/dozzle:latest
    container_name: econgrader-dozzle
    # Mounted docker.sock = root-equivalent on the Docker host. Local dev
    # machine only — never run this on a shared/production host.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:9999:8080"
    restart: unless-stopped

  filebrowser:
    # Web UI over the SAME app_storage volume the api + grading services use,
    # mounted at their identical path — paths shown match what the grader sees.
    image: filebrowser/filebrowser:latest
    container_name: econgrader-filebrowser
    environment:
      # Points Filebrowser's own DB inside its container dir, not at storage.
      - FB_DATABASE=/database/filebrowser.db
    volumes:
      - app_storage:/srv/storage
      - fb_database:/database
    # Filebrowser serves from its working dir "/" → browse at /srv/storage.
    working_dir: /srv/storage
    ports:
      - "127.0.0.1:9998:80"
    restart: unless-stopped

  langfuse-db:
    # Langfuse needs Postgres ≥ 14 (it does not speak SQL Server).
    image: postgres:16-alpine
    container_name: econgrader-langfuse-db
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:?Set LANGFUSE_DB_PASSWORD in .env (openssl rand -base64 24)}
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U langfuse" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  langfuse:
    image: langfuse/langfuse:2
    container_name: econgrader-langfuse
    depends_on:
      langfuse-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD}@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?Set LANGFUSE_NEXTAUTH_SECRET in .env (openssl rand -base64 32)}
      SALT: ${LANGFUSE_SALT:-${LANGFUSE_NEXTAUTH_SECRET}}
      TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  fb_database:
  langfuse_db_data:
