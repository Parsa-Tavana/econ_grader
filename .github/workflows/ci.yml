# CI: build + test on every push to main and every PR.
#
# Image publishing is intentionally OFF by default. To enable it, add a
# repository variable ENABLE_DEPLOY=true (repo Settings → Secrets and
# variables → Actions → Variables) plus the registry secrets — until then the
# publish job is skipped entirely, so forks never push images anywhere.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet-build:
    name: .NET build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build EconGrader.sln -c Release --nologo

  python-tests:
    name: Python grading tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: grading-service/requirements.txt
      - run: pip install -r grading-service/requirements.txt
      # No AI keys in CI: these suites cover parsing/validation/pricing logic.
      - run: pytest grading-service/tests -q
        working-directory: grading-service
        env:
          ENVIRONMENT: development

  frontend:
    name: Frontend lint / test / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Gated image publishing: skipped unless ENABLE_DEPLOY == "true" AND the run
  # is on main. Never triggered by pull_request events regardless of variables.
  publish-images:
    name: Push images to GHCR
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_DEPLOY == 'true'
    needs: [dotnet-build, python-tests, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: .
            dockerfile: Dockerfile.api
          - name: grading
            context: ./grading-service
            dockerfile: ../Dockerfile.grading
          - name: frontend
            context: ./frontend
            dockerfile: Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:latest
